[package]
name = "orderbook"
version = "0.1.0"
edition = "2021"

[lib]
name = "orderbook"
path = "src/lib.rs"

[[bin]]
name = "orderbook"
path = "src/main.rs"

[dependencies]
smallvec    = "1"
axum        = { version = "0.7", features = ["ws"] }
tokio       = { version = "1",   features = ["full"] }
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
tower-http  = { version = "0.5", features = ["cors"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "throughput"
harness = false

[profile.bench]
opt-level = 3
lto = "fat"          # link-time optimization across crates
codegen-units = 1    # single unit = better inlining decisions

